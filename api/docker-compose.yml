services:
# Api principal que se encargará de crear las APIs dinámicamente.
  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/nginx/conf.d/apis:/etc/nginx/conf.d/apis
    environment:
      - PYTHONPATH=/api
    depends_on:
      - postgres
      - mariadb
      - mysql

  appweb:
    build:
      context: ./appWeb
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./appWeb:/appWeb
      - /appWeb/node_modules
    depends_on:
      - api
# Base de datos para las apis:
  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mariadb:
    image: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_USER: root
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: mariadb
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "5433:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  mysql:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mysql
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "5434:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  # Luego se agregarán las demás bases de datos aquí, siguiendo el ejemplo de PostgreSQL.

# !!IMPORTANTE!!: No eliminar el bloque de volúmenes, es necesario para la persistencia de datos de Postgre base de datos y si se 
# añaden más bases de datos se tiene que hacer su volumen.
volumes:
  postgres_data:
  mariadb_data:
  mysql_data:
  sqlite_data: