# Configuración principal de Nginx - Coloca esto en /etc/nginx/conf.d/tfg-dam.conf
# O en /etc/nginx/sites-available/tfg-dam.libertoguillen.com

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name tfg-dam.libertoguillen.com;
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    server_name tfg-dam.libertoguillen.com;

    # Rutas a los certificados (actualiza estas rutas según tu certbot)
    ssl_certificate /etc/letsencrypt/live/tfg-dam.libertoguillen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tfg-dam.libertoguillen.com/privkey.pem;

    # Configuración SSL mejorada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging (opcional)
    access_log /var/log/nginx/tfg-dam-access.log;
    error_log /var/log/nginx/tfg-dam-error.log;

    # Raíz - proxy a appWeb (puerto 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Importante para Vite/appWeb
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API - proxy a puerto 8000
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Incluir configuraciones de APIs dinámicas
    include /etc/nginx/conf.d/apis/*.conf;
}
