# Configuración principal de Nginx - Coloca esto en /etc/nginx/conf.d/tfg-dam.conf
# O en /etc/nginx/sites-available/tfg-dam.libertoguillen.com

# Zonas de rate limiting
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_crear:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=20r/m;

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name tfg-dam.libertoguillen.com;
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    server_name tfg-dam.libertoguillen.com;

    ssl_certificate     /etc/letsencrypt/live/tfg-dam.libertoguillen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tfg-dam.libertoguillen.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "no-referrer"                         always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com wss:; frame-src https://gestion-api-rest-dam.firebaseapp.com https://accounts.google.com; frame-ancestors 'none';" always;
    # ─────────────────────────────────────────────────────────────────────────

    access_log /var/log/nginx/tfg-dam-access.log;
    error_log  /var/log/nginx/tfg-dam-error.log;

    # Raíz - proxy al panel React (puerto 3000, solo localhost)
    location / {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Docs/Redoc/OpenAPI - solo acceso local (no expuesto a internet)
    location ~ ^/(docs|redoc|openapi\.json) {
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de creación de API - rate limit estricto
    location = /crear-api {
        limit_req zone=api_crear burst=2 nodelay;

        proxy_pass http://127.0.0.1:8000/crear-api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Endpoints de gestión de APIs (proxy a la meta-API en puerto 8000)
    location ~ ^/(get-all-apis|sync|stats|fix-nginx-all) {
        limit_req zone=api_general burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Panel UI de cada API: /app/{api}/ui* → /ui-proxy/{api}/* en FastAPI
    location ~ "^/app/([a-z][a-z0-9_]{1,49})/ui" {
        rewrite ^/app/([a-z][a-z0-9_]{1,49})/ui(.*)$ /ui-proxy/$1$2 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Assets del build de producción de Vite (^~ evita que el regex de APIs gane)
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints por API: start/stop/rebuild/restore/delete/logs/status/fix-nginx/schema
    location ~ "^/[a-z][a-z0-9_]{1,49}/" {
        limit_req zone=api_general burst=15 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Endpoint de autenticación (llamado por auth_request interno)
    location = /internal/auth {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host          $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Incluir configuraciones de APIs dinámicas generadas
    include /etc/nginx/conf.d/apis/*.conf;
}
